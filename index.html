<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <main class="container my-5 d-felx flex-column align-items-center">
        <h1 class="logo-title">Hola Mundo</h1>
        <p class="epic-text">Esto es un texto epico</p>

        <div class="card custom-card shadow rounded-4 w-100" style="max-width: 450px;">
            <div class="card-body p-4 text-center">
                    <h5 class="card-title fw-bold mb-3">Contador de clicks</h5>
                    <h6 class="card-text mb-3">Cada click agrega un gato a la tarjeta </h6>
                <div id="cat-gallery" class="custom-gallery d-flex flex-wrap justify-content-start align-content-start gap-2 mb-3 p-3 rounded-3" style="height: 160px; overflow-y: auto;">
                </div>

                <button id="btn-count" class="btn custom-btn btn-lg w-100 fw-semibold rounded-3">
                    Click (<span id="counter">0</span>)
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>texto uno dos tres</p>
    </footer>

<script src="assets/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
